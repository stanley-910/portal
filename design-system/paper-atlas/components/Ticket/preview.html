<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ticket preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap">
</head>
<body>
<div id="root" class="pa-row" style="padding: 40px 48px"></div>
<script>
  var P = window.PaperAtlas, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(P.Ticket, {
      from: { code: 'HKG', city: 'Hong Kong' },
      to: { code: 'CDG', city: 'Paris' },
      date: 'Sat 3 Oct',
      distance: '9,624 km',
      onClose: function () {}
    })
  );
</script>
</body>
</html>
