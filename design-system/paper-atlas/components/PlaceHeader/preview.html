<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PlaceHeader preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap">
</head>
<body>
<div id="root" style="display: flex; gap: 48px; flex-wrap: wrap; padding: 24px"></div>
<script>
  var P = window.PaperAtlas, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(React.Fragment, null,
      h(P.PlaceHeader, { eyebrow: 'Flights to', name: 'Paris', detail: 'Charles de Gaulle · CDG' }),
      h(P.PlaceHeader, { eyebrow: 'Leaving from', name: 'Hong Kong', detail: 'Chek Lap Kok · HKG' }))
  );
</script>
</body>
</html>
