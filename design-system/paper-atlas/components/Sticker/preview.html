<!-- @dsCard group="Globe" height=120 subtitle="Plane and star pin" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sticker preview</title>
</head>
<body>
<div id="root" class="pa-row" style="gap: 40px"></div>
<script>
  var P = window.PaperAtlas, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(React.Fragment, null,
      h(P.Sticker, { shape: 'plane', size: 64, rotate: 35, title: 'Plane' }),
      h(P.Sticker, { shape: 'plane', size: 44, rotate: -60 }),
      h(P.Sticker, { shape: 'star', size: 40, rotate: 11, title: 'Origin' }),
      h(P.Sticker, { shape: 'star', size: 28 })
    )
  );
</script>
</body>
</html>
