<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
</head>
<body>
<div id="root" style="display: flex; flex-direction: column; gap: 16px; padding: 24px"></div>
<script>
  var P = window.PaperAtlas, h = React.createElement;
  var plane = h('svg', { viewBox: '0 0 16 16' }, h('path', { d: 'M2 9 L14 3 L10 14 L8 9 Z' }));
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(React.Fragment, null,
      h('div', { style: { display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'center' } },
        h(P.Button, { icon: plane }, 'Search flights'),
        h(P.Button, { variant: 'secondary' }, 'Change date'),
        h(P.Button, { variant: 'quiet' }, 'Clear')),
      h('div', { style: { display: 'flex', gap: 10, flexWrap: 'wrap', alignItems: 'center' } },
        h(P.Button, { disabled: true }, 'Search flights'),
        h(P.Button, { variant: 'secondary', disabled: true }, 'Change date')))
  );
</script>
</body>
</html>
